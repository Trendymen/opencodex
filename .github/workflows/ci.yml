name: Windows SSH capture diagnostic
run-name: Windows SSH capture diagnostic ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-capture-diagnostic:
    if: github.ref == 'refs/heads/codex/ben2-ssh-capture-diagnostic'
    name: SSH capture diagnostic only
    runs-on: windows-latest
    timeout-minutes: 85
    steps:
      - name: Checkout diagnostic script
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - name: Checkout candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: Trendymen/opencodex
          ref: 826cacdc6b4cd8e202eeebcb7a432bf0300aa918
          path: candidate
          persist-credentials: false
      - name: Checkout official source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: lidge-jun/opencodex
          ref: 873ec9b3b8ddf63f06738748d9132d779abefb42
          path: official
          persist-credentials: false
      - name: Set up Bun 1.4.4
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install candidate dependencies
        working-directory: candidate
        timeout-minutes: 5
        run: bun install --frozen-lockfile
      - name: Install official dependencies
        working-directory: official
        timeout-minutes: 5
        run: bun install --frozen-lockfile
      - name: Run fixed diagnostic
        timeout-minutes: 70
        shell: pwsh
        run: |
          bun diagnostic/.github/scripts/fork-windows-ssh-capture-diagnostic.ts
          exit $LASTEXITCODE
      - name: Upload sanitized diagnostic results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ssh-capture-diagnostic-only
          path: ${{ runner.temp }}/ocx-ssh-capture-diagnostic/results.json
          if-no-files-found: warn
          retention-days: 7
